<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Öğretmenler Günü Kutlu Olsun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1424;--panel:#0e1b2e;--gold:#c4a062;--text:#ffffff;--muted:#97a3b5;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--panel:#0e1b2e;--gold:#c4a062;--text:#ffffff;--muted:#97a3b5}}
:root[data-theme="dark"]{--bg:#0a1424;--panel:#0e1b2e;--gold:#c4a062;--text:#ffffff;--muted:#97a3b5}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:460px;border:2px solid var(--gold);border-radius:22px;background:var(--panel);padding:34px 24px 36px;text-align:center}
.top{font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;letter-spacing:.14em;color:var(--gold);margin:0}
.date{font-size:12px;color:var(--muted);letter-spacing:.12em;margin:8px 0 22px}
.rule{height:2px;background:var(--gold);border:0;margin:0 0 26px}
svg{width:100%;height:auto;display:block}
.msg{font-family:'Lora',Georgia,serif;font-weight:600;font-size:27px;line-height:1.3;color:var(--gold);margin:28px 0 0}
.msg span{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
</style>
</head>
<body>
<main class="card">
  <p class="top">TOPKAPI OKULLARI</p>
  <p class="date">24 KASIM • ÖĞRETMENLER GÜNÜ</p>
  <hr class="rule">
  <svg viewBox="0 0 520 260" role="img" aria-label="Otomotiv: yandan görünüm araba ve dişli">
    <g fill="none" stroke="#c4a062" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <g opacity=".35" stroke-width="4">
        <circle cx="420" cy="62" r="34"/><circle cx="420" cy="62" r="12"/>
        <path d="M420 18v14M420 92v14M376 62h14M450 62h14M389 31l10 10M441 83l10 10M451 31l-10 10M399 83l-10 10"/>
      </g>
      <path d="M52 196v-34q0-14 16-18l66-10 42-38q10-9 24-9h118q14 0 24 9l40 36 52 8q16 3 16 18v38"/>
      <path d="M52 196h50M198 196h128M422 196h46"/>
      <path d="M168 134l34-30h58v30zM276 134v-30h46l32 30z" stroke-width="4"/>
      <path d="M276 104v30" stroke-width="4"/>
      <circle cx="150" cy="196" r="38"/><circle cx="150" cy="196" r="14"/>
      <circle cx="374" cy="196" r="38"/><circle cx="374" cy="196" r="14"/>
      <path d="M20 236h480" stroke-width="3" opacity=".5"/>
    </g>
  </svg>
  <p class="msg"><span>Otomotiv Bölümü</span>Öğretmenler Gününüzü Kutlar</p>
</main>
</body>
</html>
